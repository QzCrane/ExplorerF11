name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /EHsc /W4 /O2 /DNDEBUG ^
             src\main.cpp src\config.cpp src\footprint.cpp ^
             /Fo:dist\ /Fe:dist\ExplorerF11.exe ^
             /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1

      - name: Smoke test the binary
        shell: cmd
        run: |
          dist\ExplorerF11.exe --version
          dist\ExplorerF11.exe --help >nul
          dist\ExplorerF11.exe --menu --lang en | findstr /C:"Language" >nul
          if errorlevel 1 exit /b 1
          dist\ExplorerF11.exe --menu >nul
          dist\ExplorerF11.exe --status --lang en
          rem --status exits 1 when the machine has traces; that is expected here.

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerF11-x64
          path: dist/ExplorerF11.exe
          if-no-files-found: error
