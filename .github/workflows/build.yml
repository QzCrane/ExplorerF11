name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Python picks its stdout encoding from the console code page, and the
      # suites print Chinese, Japanese and Korean. Without this, a green suite
      # on a developer's machine dies with UnicodeEncodeError on the runner.
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v7

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist dist mkdir dist
          rc /nologo /I src /fo dist\app.res src\app.rc
          if errorlevel 1 exit /b 1
          rem /utf-8 is mandatory: the sources are UTF-8 without a BOM and carry
          rem CJK wide literals. Without it cl decodes them with the ANSI code
          rem page and the Japanese and Korean strings turn into mojibake.
          cl /nologo /std:c++latest /utf-8 /EHsc /W4 /O2 /DNDEBUG ^
             src\main.cpp src\config.cpp src\residue.cpp src\i18n_extra.cpp dist\app.res ^
             /Fo:dist\ /Fe:dist\ExplorerF11.exe ^
             /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1

      - name: Guard the translation table
        run: |
          python tools/check_i18n.py
          python tools/audit_i18n.py
          python tools/check_help_align.py

      - name: Test the CLI surface
        run: |
          python tests/test_lang_names.py
          python tests/test_menu_order.py
          python tests/test_robustness.py

      - name: Smoke test the binary
        shell: cmd
        run: |
          rem Every invocation redirects stdout to a file: this is a -mwindows
          rem binary, so an explicitly captured handle is the only channel that
          rem is reliable everywhere, and --quiet guarantees no dialog can ever
          rem block the job. Assertions stay ASCII-only so the batch file's own
          rem encoding cannot influence the result.
          dist\ExplorerF11.exe --version --quiet > dist\version.txt 2>&1
          type dist\version.txt
          findstr /C:"ExplorerF11 1.0.2" dist\version.txt >nul || exit /b 1

          dist\ExplorerF11.exe --help --quiet > dist\help.txt 2>&1
          findstr /C:"--status" dist\help.txt >nul || exit /b 1
          rem The help must state the counting unit: windows, never tabs.
          findstr /C:"counted in windows" dist\help.txt >nul || exit /b 1

          dist\ExplorerF11.exe --menu --lang en --quiet > dist\menu-en.txt 2>&1
          type dist\menu-en.txt
          findstr /C:"Language" dist\menu-en.txt >nul || exit /b 1
          findstr /C:"Residue report" dist\menu-en.txt >nul || exit /b 1
          rem The per-tab wording was retired in 6.1.1; it must not come back.
          findstr /C:"Re-accelerate the window on new tabs" dist\menu-en.txt >nul || exit /b 1
          rem The five languages must all be selectable, and each name is the
          rem endonym from i18n.h: LangName(), identical in every UI language.
          rem Asserted in Python with \u escapes, never as literals: this file is
          rem a .cmd written by the runner and read by cmd.exe in the OEM code
          rem page, so a CJK literal here would be mojibake before findstr ever
          rem sees it. ASCII-only is what makes the check portable.
          python -c "import io,sys; d=io.open(r'dist\menu-en.txt',encoding='utf-8').read(); need=[u'\u7b80\u4f53\u4e2d\u6587',u'\u7e41\u9ad4\u4e2d\u6587',u'\u65e5\u672c\u8a9e',u'\ud55c\uad6d\uc5b4']; sys.exit(0 if all(n in d for n in need) else 1)"
          if errorlevel 1 exit /b 1

          rem The Chinese dump must not carry the English labels; that absence is
          rem what proves --lang really re-localised the menu.
          dist\ExplorerF11.exe --menu --lang zh --quiet > dist\menu-zh.txt 2>&1
          findstr /C:"Start with Windows" dist\menu-zh.txt >nul && exit /b 1

          rem --status exits 1 when the machine has residues, which a fresh runner
          rem usually does. Only the report body is asserted, not the exit code.
          dist\ExplorerF11.exe --status --lang en --quiet > dist\status.txt 2>&1
          type dist\status.txt
          findstr /C:"program:" dist\status.txt >nul || exit /b 1

          rem A --lang override must leave nothing behind: the tool writes a
          rem setting only when the user changes it, so the key must not exist.
          reg query "HKCU\Software\ExplorerF11" >nul 2>&1 && exit /b 1

          rem app.rc carries the two icons and the version block. If rc.exe never
          rem ran, the exe shows the generic blank document and has no version -
          rem so look for the resource payload itself, in UTF-16 as stored.
          python -c "import sys; d=open(r'dist\ExplorerF11.exe','rb').read(); sys.exit(0 if 'VS_VERSION_INFO'.encode('utf-16-le') in d and 'ExplorerF11 - instant Explorer acceleration'.encode('utf-16-le') in d else 1)"
          if errorlevel 1 exit /b 1
          exit /b 0

      - uses: actions/upload-artifact@v7
        with:
          name: ExplorerF11-x64
          path: dist/ExplorerF11.exe
          if-no-files-found: error
