name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /EHsc /W4 /O2 /DNDEBUG ^
             src\main.cpp src\config.cpp src\footprint.cpp ^
             /Fo:dist\ /Fe:dist\ExplorerF11.exe ^
             /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1

      - name: Smoke test the binary
        shell: cmd
        run: |
          rem Every invocation redirects stdout to a file: this is a -mwindows
          rem binary, so an explicitly captured handle is the only channel that
          rem is reliable everywhere, and --quiet guarantees no dialog can ever
          rem block the job. Assertions stay ASCII-only so the batch file's own
          rem encoding cannot influence the result.
          dist\ExplorerF11.exe --version --quiet > dist\version.txt 2>&1
          type dist\version.txt
          findstr /C:"ExplorerF11 6.1.0" dist\version.txt >nul || exit /b 1

          dist\ExplorerF11.exe --help --quiet > dist\help.txt 2>&1
          findstr /C:"--status" dist\help.txt >nul || exit /b 1

          dist\ExplorerF11.exe --menu --lang en --quiet > dist\menu-en.txt 2>&1
          type dist\menu-en.txt
          findstr /C:"Language" dist\menu-en.txt >nul || exit /b 1

          rem The Chinese dump must not carry the English labels; that absence is
          rem what proves --lang really re-localised the menu.
          dist\ExplorerF11.exe --menu --lang zh --quiet > dist\menu-zh.txt 2>&1
          findstr /C:"Start with Windows" dist\menu-zh.txt >nul && exit /b 1

          rem --status exits 1 when the machine has traces, which a fresh runner
          rem usually does. Only the report body is asserted, not the exit code.
          dist\ExplorerF11.exe --status --lang en --quiet > dist\status.txt 2>&1
          type dist\status.txt
          findstr /C:"program:" dist\status.txt >nul || exit /b 1

          rem A --lang override must leave nothing behind: the tool writes a
          rem setting only when the user changes it, so the key must not exist.
          reg query "HKCU\Software\ExplorerF11" >nul 2>&1 && exit /b 1
          exit /b 0

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerF11-x64
          path: dist/ExplorerF11.exe
          if-no-files-found: error
